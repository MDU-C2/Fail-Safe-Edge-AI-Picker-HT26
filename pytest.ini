[pytest]
testpaths = gateway/tests
addopts = -ra -p gateway.tests.implementation
markers =
    robotstudio: needs the RobotStudio virtual controller on 127.0.0.1 (enable with --robotstudio)
    oak: needs the real OAK camera (enable with --oak)
    real_robot: moves the real YuMi a few mm through a running gateway (enable with --real-robot)
    real_robot_gripper: also closes and opens the real grippers (enable with --real-robot-gripper)
    legacy_command: tests the legacy POST /robot/command, which only the Python gateway has (skipped with --impl cpp)
    python_internals: unit test of Python gateway code, not of a running gateway (skipped with --impl cpp; C++ counterpart in gateway/cpp/tests)
    cpp_only: behaviour only the C++ gateway has; the Python gateway is legacy and gets no new features (skipped with --impl python)
