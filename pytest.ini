[pytest]
testpaths = gateway/tests
addopts = -ra
markers =
    robotstudio: needs the RobotStudio virtual controller on 127.0.0.1 (enable with --robotstudio)
    oak: needs the real OAK camera (enable with --oak)
    real_robot: moves the real YuMi a few mm through a running gateway (enable with --real-robot)
    real_robot_gripper: also closes and opens the real grippers (enable with --real-robot-gripper)
